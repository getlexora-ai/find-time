    <use href="#ft-M" x="420" y="24"/>
    <use href="#ft-E" x="480" y="24"/>
    <path d="M290 10h30v6h-24v24h-6z"/>
    <path d="M550 10h-30v6h24v24h6z"/>
    <path d="M290 110h30v-6h-24v-24h-6z"/>
    <path d="M550 110h-30v-6h24v-24h6z"/>
